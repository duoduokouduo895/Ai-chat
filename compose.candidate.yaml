services:
  ai-chat-backend:
    image: ${AICHAT_IMAGE:?Load versions.env before running Compose}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: prod,nacos
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      SPRING_CLOUD_NACOS_DISCOVERY_ENABLED: "false"
      SPRING_R2DBC_HOST: mysql
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_RABBITMQ_DYNAMIC: "false"
      SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP: "false"
      APP_SCHEDULING_ENABLED: "false"
      APP_FLYWAY_ENABLED: "false"
      ELASTICSEARCH_SYNC_ENABLED: "false"
      HEALTH_CHECK_ENABLED: "false"
      AIDIAG_INTEGRATION_ENABLED: "true"
      AIDIAG_BASE_URL: http://aidiag-backend:8080
      AIDIAG_READ_API_USERNAME: ${AIDIAG_READ_API_USERNAME:-aidiag-reader}
      AIDIAG_SERVICE_NAME: ai-chat-candidate
      LANGCHAIN4J_OPEN_AI_RELIABILITY_WARMUP_ENABLED: "false"
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 20s
      MANAGEMENT_SERVER_PORT: 9091
      OTEL_SERVICE_NAME: ai-chat-candidate
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${DEPLOYMENT_ENVIRONMENT:-cloud-candidate},service.version=${AICHAT_RELEASE:-unknown}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: "true"
    ports:
      - "127.0.0.1:${AICHAT_CANDIDATE_PORT:-18082}:8080"
      - "127.0.0.1:${AICHAT_MANAGEMENT_PORT:-19091}:9091"
    expose:
      - "9091"
    networks:
      middleware:
      nacos:
      telemetry:
        aliases:
          - ai-chat-candidate
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9091/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /opt/aichat/nacos:size=32m,mode=0700,uid=10001,gid=10001
    volumes:
      - ${AICHAT_LOG_DIR:-/opt/ai-chat/logs}:/var/log/ai-chat
    secrets:
      - source: aidiag_read_api_secret
        target: aidiag.read-api.secret
    security_opt:
      - no-new-privileges:true

networks:
  middleware:
    external: true
    name: middleware-net
  nacos:
    external: true
    name: nacos-net
  telemetry:
    external: true
    name: aidiag-telemetry

secrets:
  aidiag_read_api_secret:
    file: ${AIDIAG_SECRETS_DIR:-/opt/aidiag/runtime/.secrets}/aidiag_read_api_secret
