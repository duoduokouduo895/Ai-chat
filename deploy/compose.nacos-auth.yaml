services:
  ai-chat-backend:
    environment:
      AICHAT_REQUIRE_NACOS_AUTH: "true"
    secrets:
      - source: nacos_username
        target: nacos.username
      - source: nacos_password
        target: nacos.password

secrets:
  nacos_username:
    file: ${AICHAT_SECRETS_DIR:-/opt/ai-chat/runtime/.secrets}/nacos_username
  nacos_password:
    file: ${AICHAT_SECRETS_DIR:-/opt/ai-chat/runtime/.secrets}/nacos_password
