<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent 健康检查面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(86, 171, 47, 0.3);
        }
        
        .status-panel {
            padding: 30px;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border-left: 4px solid #667eea;
            transition: transform 0.3s ease;
        }
        
        .status-card:hover {
            transform: translateY(-2px);
        }
        
        .status-card.healthy {
            border-left-color: #28a745;
        }
        
        .status-card.warning {
            border-left-color: #ffc107;
        }
        
        .status-card.error {
            border-left-color: #dc3545;
        }
        
        .status-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .status-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 20px;
        }
        
        .status-icon.healthy {
            background: #d4edda;
            color: #28a745;
        }
        
        .status-icon.warning {
            background: #fff3cd;
            color: #ffc107;
        }
        
        .status-icon.error {
            background: #f8d7da;
            color: #dc3545;
        }
        
        .status-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }
        
        .status-details {
            color: #666;
            line-height: 1.6;
        }
        
        .log-section {
            margin-top: 30px;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
        }
        
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .log-content {
            background: #2d3748;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.5;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .timestamp {
            color: #a0aec0;
            font-size: 0.9rem;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
        }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #667eea;
        }
        
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .status-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 AI Agent 健康检查面板</h1>
            <p>实时监控系统健康状态 | 每10分钟自动检查</p>
        </div>
        
        <div class="controls">
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="triggerHealthCheck()">
                    🔄 立即检查
                </button>
                <button class="btn btn-success" onclick="checkActuatorHealth()">
                    ✅ Actuator 健康检查
                </button>
                <button class="btn btn-primary" onclick="checkDocumentProcessing()">
                    📄 检查文档处理状态
                </button>
                <a href="http://localhost:8080/actuator/health" target="_blank" class="btn btn-primary">
                    🌐 查看 Actuator 端点
                </a>
            </div>
            
            <div class="auto-refresh">
                <span>自动刷新:</span>
                <label class="switch">
                    <input type="checkbox" id="autoRefresh" checked>
                    <span class="slider"></span>
                </label>
                <span id="refreshStatus">开启</span>
            </div>
        </div>
        
        <div class="status-panel">
            <div class="status-grid" id="statusGrid">
                <!-- 状态卡片将在这里动态生成 -->
            </div>
            
            <div class="log-section">
                <div class="log-header">
                    <h3>📋 检查日志</h3>
                    <span class="timestamp" id="lastUpdate">正在加载...</span>
                </div>
                <div class="log-content" id="logContent">
                    系统启动中，正在加载健康检查数据...
                </div>
            </div>
        </div>
    </div>

    <script>
        // 后端服务器配置
        const API_BASE_URL = 'http://localhost:8080';
        
        // 创建完整的API URL
        function getApiUrl(endpoint) {
            return API_BASE_URL + endpoint;
        }
        
        let autoRefreshInterval = null;
        let isAutoRefreshEnabled = true;
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadHealthStatus();
            setupAutoRefresh();
        });
        
        // 设置自动刷新
        function setupAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            const status = document.getElementById('refreshStatus');
            
            checkbox.addEventListener('change', function() {
                isAutoRefreshEnabled = this.checked;
                status.textContent = this.checked ? '开启' : '关闭';
                
                if (this.checked) {
                    startAutoRefresh();
                } else {
                    stopAutoRefresh();
                }
            });
            
            if (isAutoRefreshEnabled) {
                startAutoRefresh();
            }
        }
        
        function startAutoRefresh() {
            stopAutoRefresh(); // 清除现有的定时器
            autoRefreshInterval = setInterval(() => {
                loadHealthStatus();
            }, 30000); // 30秒刷新一次
        }
        
        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }
        
        // 手动触发健康检查
        async function triggerHealthCheck() {
            addLog('📢 手动触发健康检查...');
            
            try {
                const response = await fetch(getApiUrl('/api/diagnostic/trigger-health-check'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    addLog('✅ 健康检查已触发，请查看服务器日志获取详细结果');
                    // 等待几秒后刷新状态
                    setTimeout(() => {
                        loadHealthStatus();
                    }, 3000);
                } else {
                    addLog('❌ 触发健康检查失败: ' + (result.message || result.error));
                }
            } catch (error) {
                addLog('❌ 触发健康检查请求失败: ' + error.message);
            }
        }
        
        // 检查 Actuator 健康状态
        async function checkActuatorHealth() {
            addLog('🔍 正在检查 Actuator 健康状态...');
            
            try {
                const response = await fetch(getApiUrl('/actuator/health'));
                const health = await response.json();
                
                updateHealthCard('actuator', {
                    title: 'Spring Boot Actuator',
                    status: health.status,
                    details: health,
                    icon: health.status === 'UP' ? '✅' : '❌'
                });
                
                addLog('✅ Actuator 健康检查完成: ' + health.status);
            } catch (error) {
                updateHealthCard('actuator', {
                    title: 'Spring Boot Actuator',
                    status: 'ERROR',
                    details: { error: error.message },
                    icon: '❌'
                });
                addLog('❌ Actuator 健康检查失败: ' + error.message);
            }
        }
        
        // 批量检查文档处理状态
        async function checkDocumentProcessing() {
            addLog('📄 检查文档处理状态...');
            
            try {
                // 检查RabbitMQ队列状态
                const queueResponse = await fetch(getApiUrl('/api/diagnostic/rabbitmq-queue-status'));
                const queueStatus = await queueResponse.json();
                
                if (queueStatus.success) {
                    addLog('✅ RabbitMQ队列状态:');
                    
                    const queues = queueStatus.queueStatus;
                    for (const [queueName, info] of Object.entries(queues)) {
                        if (typeof info === 'object' && info.messageCount !== undefined) {
                            addLog(`   ${queueName}: 消息数: ${info.messageCount}, 消费者数: ${info.consumerCount}`);
                            
                            if (info.messageCount > 0) {
                                addLog(`⚠️ 队列 ${queueName} 中有 ${info.messageCount} 条未处理消息`);
                            }
                        } else {
                            addLog(`   ${queueName}: ${info}`);
                        }
                    }
                } else {
                    addLog('❌ RabbitMQ队列状态检查失败: ' + queueStatus.error);
                }
                
                // 检查处理统计
                const healthResponse = await fetch(getApiUrl('/api/diagnostic/health'));
                const healthData = await healthResponse.json();
                
                if (healthData.status === 'OK' && healthData.processingStatistics) {
                    const stats = healthData.processingStatistics;
                    addLog('📊 处理统计:');
                    addLog(`   待处理: ${stats.pendingCount || 0}`);
                    addLog(`   处理中: ${stats.processingCount || 0}`);
                    addLog(`   已完成: ${stats.completedCount || 0}`);
                    addLog(`   失败: ${stats.failedCount || 0}`);
                    
                    if (stats.pendingCount > 0) {
                        addLog(`⚠️ 发现 ${stats.pendingCount} 个待处理的文档`);
                    }
                }
                
                updateHealthCard('document-processing', {
                    title: '文档处理监控',
                    status: 'OK',
                    details: {
                        queueStatus: queueStatus,
                        processingStats: healthData.processingStatistics
                    },
                    icon: '📄'
                });
                
            } catch (error) {
                addLog('❌ 文档处理状态检查失败: ' + error.message);
                
                updateHealthCard('document-processing', {
                    title: '文档处理监控',
                    status: 'ERROR',
                    details: { error: error.message },
                    icon: '❌'
                });
            }
        }
        
        // 加载健康状态
        async function loadHealthStatus() {
            addLog('🔄 刷新健康状态...');
            
            try {
                // 同时检查多个端点
                const [actuatorResponse, diagnosticResponse] = await Promise.allSettled([
                    fetch(getApiUrl('/actuator/health')),
                    fetch(getApiUrl('/api/diagnostic/health'))
                ]);
                
                // 处理 Actuator 响应
                if (actuatorResponse.status === 'fulfilled') {
                    const actuatorHealth = await actuatorResponse.value.json();
                    updateHealthCard('actuator', {
                        title: 'Spring Boot Actuator',
                        status: actuatorHealth.status,
                        details: actuatorHealth,
                        icon: actuatorHealth.status === 'UP' ? '✅' : '❌'
                    });
                } else {
                    updateHealthCard('actuator', {
                        title: 'Spring Boot Actuator',
                        status: 'ERROR',
                        details: { error: 'Connection failed' },
                        icon: '❌'
                    });
                }
                
                // 处理诊断端点响应
                if (diagnosticResponse.status === 'fulfilled') {
                    const diagnosticHealth = await diagnosticResponse.value.json();
                    updateHealthCard('diagnostic', {
                        title: '系统诊断检查',
                        status: diagnosticHealth.status,
                        details: diagnosticHealth,
                        icon: diagnosticHealth.status === 'OK' ? '✅' : '❌'
                    });
                } else {
                    updateHealthCard('diagnostic', {
                        title: '系统诊断检查',
                        status: 'ERROR',
                        details: { error: 'Connection failed' },
                        icon: '❌'
                    });
                }
                
                updateLastUpdateTime();
                addLog('✅ 健康状态刷新完成');
                
            } catch (error) {
                addLog('❌ 健康状态刷新失败: ' + error.message);
            }
        }
        
        // 更新健康卡片
        function updateHealthCard(cardId, data) {
            const grid = document.getElementById('statusGrid');
            let card = document.getElementById('card-' + cardId);
            
            if (!card) {
                card = document.createElement('div');
                card.id = 'card-' + cardId;
                card.className = 'status-card';
                grid.appendChild(card);
            }
            
            const statusClass = getStatusClass(data.status);
            card.className = 'status-card ' + statusClass;
            
            card.innerHTML = `
                <div class="status-header">
                    <div class="status-icon ${statusClass}">
                        ${data.icon}
                    </div>
                    <div class="status-title">${data.title}</div>
                </div>
                <div class="status-details">
                    <strong>状态:</strong> ${data.status}<br>
                    ${formatDetails(data.details)}
                </div>
            `;
        }
        
        // 获取状态样式类
        function getStatusClass(status) {
            switch (status) {
                case 'UP':
                case 'OK':
                    return 'healthy';
                case 'DOWN':
                case 'ERROR':
                    return 'error';
                default:
                    return 'warning';
            }
        }
        
        // 格式化详细信息
        function formatDetails(details) {
            if (!details) return '';
            
            let result = '';
            
            if (details.totalDocuments !== undefined) {
                result += `<strong>文档总数:</strong> ${details.totalDocuments}<br>`;
            }
            
            if (details.processingStatistics) {
                const stats = details.processingStatistics;
                result += `<strong>处理统计:</strong><br>`;
                for (const [key, value] of Object.entries(stats)) {
                    result += `&nbsp;&nbsp;${key}: ${value}<br>`;
                }
            }
            
            if (details.components) {
                result += `<strong>组件状态:</strong><br>`;
                for (const [name, component] of Object.entries(details.components)) {
                    result += `&nbsp;&nbsp;${name}: ${component.status}<br>`;
                }
            }
            
            if (details.error) {
                result += `<strong>错误:</strong> ${details.error}<br>`;
            }
            
            return result;
        }
        
        // 添加日志
        function addLog(message) {
            const logContent = document.getElementById('logContent');
            const timestamp = new Date().toLocaleString('zh-CN');
            const logLine = `[${timestamp}] ${message}`;
            
            // 如果是第一条日志，清空初始内容
            if (logContent.textContent.includes('系统启动中')) {
                logContent.textContent = '';
            }
            
            logContent.textContent = logLine + '\n' + logContent.textContent;
            
            // 限制日志行数
            const lines = logContent.textContent.split('\n');
            if (lines.length > 100) {
                logContent.textContent = lines.slice(0, 100).join('\n');
            }
        }
        
        // 更新最后更新时间
        function updateLastUpdateTime() {
            const lastUpdate = document.getElementById('lastUpdate');
            lastUpdate.textContent = '最后更新: ' + new Date().toLocaleString('zh-CN');
        }
    </script>
</body>
</html>
