# Elasticsearch 基础配置文件
# 服务器配置
spring.elasticsearch.uris=http://111.230.243.93:9200
spring.elasticsearch.connection-timeout=10000
spring.elasticsearch.socket-timeout=60000

# 基本连接配置
spring.elasticsearch.username=
spring.elasticsearch.password=

# 索引配置
spring.elasticsearch.index.number-of-shards=1
spring.elasticsearch.index.number-of-replicas=0

# 开发环境配置
spring.elasticsearch.dev.auto-create-index=true