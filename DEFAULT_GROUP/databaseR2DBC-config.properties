# 数据库配置文件
# Data ID: database-config.properties
# Group: DEFAULT_GROUP
# 命名空间: ai-agent (可选)

# R2DBC数据库连接配置
# 添加字符编码参数解决中文乱码问题
spring.r2dbc.url=r2dbc:mysql://111.230.243.93:3306/ai_agent_db?characterEncoding=utf8mb4&useUnicode=true
spring.r2dbc.username=root
spring.r2dbc.password=895895

# R2DBC连接池配置
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=50
spring.r2dbc.pool.max-idle-time=30m
spring.r2dbc.pool.max-life-time=60m
spring.r2dbc.pool.max-acquire-time=60s
spring.r2dbc.pool.max-create-connection-time=60s
spring.r2dbc.pool.validation-query=SELECT 1

# R2DBC日志配置
logging.level.org.springframework.r2dbc=DEBUG
logging.level.io.r2dbc.mysql.QUERY=DEBUG
logging.level.io.r2dbc.mysql.PARAM=DEBUG
