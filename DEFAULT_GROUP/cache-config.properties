# 缓存配置文件
# Data ID: cache-config.properties
# Group: DEFAULT_GROUP
# 命名空间: ai-agent (可选)

# 对话历史缓存配置
cache.conversation.expire-hours=0.5
cache.conversation.max-size=1000
cache.conversation.enable-compression=true

# AI响应缓存配置
cache.ai-response.expire-days=7
cache.ai-response.max-size=5000
cache.ai-response.enable-compression=true
cache.ai-response.cache-null-values=false

# API限流缓存配置
cache.rate-limit.expire-minutes=1
cache.rate-limit.max-size=10000
cache.rate-limit.enable-compression=false

# 缓存统计配置
cache.statistics.enabled=true
cache.statistics.export-interval=300

# 缓存预热配置
cache.warmup.enabled=false
cache.warmup.delay-seconds=30
cache.warmup.batch-size=100

# 缓存清理配置
cache.cleanup.enabled=true
cache.cleanup.interval-hours=6
cache.cleanup.threshold-percentage=80