# RabbitMQ消息队列配置文件
# 用途：此文件需要上传到Nacos配置中心，用于动态管理RabbitMQ相关配置
# 使用方法：
# 1. 登录Nacos控制台 (http://nacos-server:8848/nacos)
# 2. 进入配置管理 -> 配置列表
# 3. 点击新建配置
# 4. Data ID: rabbitmq-config.properties
# 5. Group: DEFAULT_GROUP
# 6. 配置格式: Properties
# 7. 将此文件内容复制粘贴到配置内容中
# 8. 点击发布

# ==================== RabbitMQ服务器连接配置 ====================
# RabbitMQ服务器地址
spring.rabbitmq.host=113.45.11.64

# RabbitMQ服务器端口（默认5672）
spring.rabbitmq.port=5672

# RabbitMQ用户名（请根据实际情况修改）
spring.rabbitmq.username=guest

# RabbitMQ密码（请根据实际情况修改）
spring.rabbitmq.password=guest

# 虚拟主机（默认为/）
spring.rabbitmq.virtual-host=/

# ==================== 连接池配置 ====================
# 连接超时时间（毫秒）
spring.rabbitmq.connection-timeout=60000

# 请求心跳超时时间（秒）
spring.rabbitmq.requested-heartbeat=60

# 发布确认模式（确保消息可靠投递）
spring.rabbitmq.publisher-confirm-type=correlated

# 发布返回模式（处理无法路由的消息）
spring.rabbitmq.publisher-returns=true

# 强制回调（即使消息成功投递也会触发回调）
spring.rabbitmq.template.mandatory=true

# ==================== 消费者配置 ====================
# 手动确认模式（确保消息处理完成后才确认）
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# 并发消费者数量（最小值）
spring.rabbitmq.listener.simple.concurrency=2

# 并发消费者数量（最大值）
spring.rabbitmq.listener.simple.max-concurrency=10

# 每个消费者预取消息数量
spring.rabbitmq.listener.simple.prefetch=1

# 重试机制启用
spring.rabbitmq.listener.simple.retry.enabled=true

# 最大重试次数
spring.rabbitmq.listener.simple.retry.max-attempts=3

# 重试间隔时间（毫秒）
spring.rabbitmq.listener.simple.retry.initial-interval=1000

# ==================== AI任务队列配置 ====================
# AI处理任务队列名称
rabbitmq.queue.ai-task=ai-task-queue

# AI处理任务死信队列名称
rabbitmq.queue.ai-task-dlq=ai-task-dlq

# AI处理任务交换机名称
rabbitmq.exchange.ai-task=ai-task-exchange

# AI处理任务死信交换机名称
rabbitmq.exchange.ai-task-dlx=ai-task-dlx

# AI处理任务路由键
rabbitmq.routing-key.ai-task=ai.task.process

# AI处理任务死信路由键
rabbitmq.routing-key.ai-task-dlq=ai.task.dlq

# ==================== 性能优化配置 ====================
# 注意：Spring Boot默认使用CHANNEL缓存模式，此模式下不能配置连接缓存大小
# 如需使用CONNECTION缓存模式，请添加：spring.rabbitmq.cache.connection.mode=CONNECTION

# 缓存连接数量（仅在CONNECTION模式下有效，CHANNEL模式下会导致启动错误）
# spring.rabbitmq.cache.connection.size=10

# 缓存通道数量（CHANNEL模式下的主要缓存配置）
spring.rabbitmq.cache.channel.size=50

# 缓存通道检出超时时间（毫秒）
spring.rabbitmq.cache.channel.checkout-timeout=5000

# ==================== SSL配置（如果需要）====================
# 启用SSL（生产环境建议开启）
# spring.rabbitmq.ssl.enabled=false

# SSL信任存储路径
# spring.rabbitmq.ssl.trust-store=classpath:rabbitmq.truststore

# SSL信任存储密码
# spring.rabbitmq.ssl.trust-store-password=password

# ==================== 监控和日志配置 ====================
# 启用RabbitMQ管理插件监控
management.endpoints.web.exposure.include=health,info,metrics,rabbitmq

# RabbitMQ健康检查
management.health.rabbit.enabled=true

# ==================== 业务配置 ====================
# AI任务处理超时时间（毫秒）
ai.task.timeout=300000

# AI任务最大重试次数
ai.task.max-retries=3

# AI任务优先级队列启用
ai.task.priority.enabled=true

# 高优先级任务阈值
ai.task.priority.high-threshold=5

# ==================== 配置说明 ====================
# 1. 队列配置：定义了AI任务处理的主队列和死信队列
# 2. 交换机配置：使用Direct类型交换机进行精确路由
# 3. 重试机制：支持消息处理失败后的自动重试
# 4. 死信队列：处理最终失败的消息，便于问题排查
# 5. 性能优化：配置了连接池和并发处理参数
# 6. 监控支持：集成Spring Boot Actuator进行健康检查

# ==================== 注意事项 ====================
# 1. 请根据实际RabbitMQ服务器配置修改用户名和密码
# 2. 生产环境建议启用SSL加密传输
# 3. 根据服务器性能调整并发消费者数量
# 4. 定期监控队列积压情况，及时调整配置
# 5. 建议为不同环境（开发、测试、生产）创建不同的配置文件