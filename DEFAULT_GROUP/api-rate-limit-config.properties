# API限流配置文件
# Data ID: api-rate-limit-config.properties
# Group: DEFAULT_GROUP
# 命名空间: ai-agent (可选)

# 基本限流配置
api.rate-limit.enabled=true
api.rate-limit.requests-per-minute=60
api.rate-limit.time-window-minutes=1
api.rate-limit.burst-capacity=10

# 不同用户类型的限流配置
api.rate-limit.vip.requests-per-minute=120
api.rate-limit.vip.time-window-minutes=1
api.rate-limit.premium.requests-per-minute=200
api.rate-limit.premium.time-window-minutes=1

# IP级别限流配置
api.rate-limit.ip.enabled=true
api.rate-limit.ip.requests-per-minute=300
api.rate-limit.ip.time-window-minutes=1

# 全局限流配置
api.rate-limit.global.enabled=true
api.rate-limit.global.requests-per-minute=1000
api.rate-limit.global.time-window-minutes=1

# 限流策略配置
api.rate-limit.strategy=sliding-window
api.rate-limit.reject-strategy=fast-fail
api.rate-limit.fallback-enabled=true

# 限流监控配置
api.rate-limit.monitoring.enabled=true
api.rate-limit.monitoring.alert-threshold=0.8
api.rate-limit.monitoring.export-metrics=true