# Redis鍩烘湰閰嶇疆 (Standalone/鍗曟満妯″紡)
spring.data.redis.host=**
spring.data.redis.port=6379
spring.data.redis.password=**
spring.data.redis.database=0

# 杩炴帴瓒呮椂鏃堕棿 - 浼樺寲閰嶇疆
spring.data.redis.timeout=8000ms
spring.data.redis.connect-timeout=3000ms

# Redis杩炴帴姹犻厤缃?(Lettuce) - 浼樺寲閰嶇疆
spring.data.redis.lettuce.pool.max-active=30
spring.data.redis.lettuce.pool.max-idle=15
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=3000ms
spring.data.redis.lettuce.shutdown-timeout=1000ms

# Lettuce 瀹㈡埛绔厤缃?- 鏂板
spring.data.redis.lettuce.pool.time-between-eviction-runs=60s
spring.data.redis.lettuce.pool.min-evictable-idle-time=30s

# 搴忓垪鍖栭厤缃?
spring.data.redis.key-serializer=org.springframework.data.redis.serializer.StringRedisSerializer
spring.data.redis.hash-key-serializer=org.springframework.data.redis.serializer.StringRedisSerializer
spring.data.redis.value-serializer=org.springframework.data.redis.serializer.GenericJackson2JsonRedisSerializer
spring.data.redis.hash-value-serializer=org.springframework.data.redis.serializer.GenericJackson2JsonRedisSerializer
