# 阿里云OSS配置
# Data ID: oss-config.properties
# Group: DEFAULT_GROUP

# OSS基本配置
aliyun.oss.endpoint=https://oss-cn-guangzhou.aliyuncs.com
aliyun.oss.access-key-id=REDACTED_ACCESS_KEY_ID_2
aliyun.oss.access-key-secret=REDACTED_ACCESS_KEY_SECRET_2
aliyun.oss.bucket-name=cc-ceshi-1
aliyun.oss.url-prefix=https://cc-ceshi-1.oss-cn-guangzhou.aliyuncs.com

# 知识库配置
# Data ID: knowledge-base-config.properties
# Group: DEFAULT_GROUP

# 文档处理配置
knowledge-base.document.max-file-size-mb=50
knowledge-base.document.supported-types=pdf,docx,doc,txt,md,pptx,xlsx
knowledge-base.document.max-segment-size=500
knowledge-base.document.max-overlap-size=50

# 向量化配置
knowledge-base.embedding.default-model=qwen-embedding-8b
knowledge-base.embedding.index-prefix=kb_
knowledge-base.embedding.batch-size=100

# RAG配置
knowledge-base.rag.max-results=10
knowledge-base.rag.min-score=0.7
knowledge-base.rag.enable-reranking=false