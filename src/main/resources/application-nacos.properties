# Nacos 为可选基础设施，仅在显式启用 nacos profile 时连接。
# 示例：SPRING_PROFILES_ACTIVE=prod,nacos
spring.cloud.nacos.config.enabled=true
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.file-extension=properties
spring.cloud.nacos.config.group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.config.username=${NACOS_USERNAME:}
spring.cloud.nacos.config.password=${NACOS_PASSWORD:}

spring.cloud.nacos.discovery.enabled=true
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.discovery.group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:}

management.endpoints.web.exposure.include=health,info,nacos,metrics

spring.config.import=optional:nacos:databaseR2DBC-config.properties,\
  optional:nacos:redis-config.properties,\
  optional:nacos:langchain4j-config.properties,\
  optional:nacos:cache-config.properties,\
  optional:nacos:rabbitmq-config.properties,\
  optional:nacos:api-rate-limit-config.properties,\
  optional:nacos:chat-elasticsearch-config.properties,\
  optional:nacos:knowledge-base-config.properties,\
  optional:nacos:jwt-config.properties
