# Nacos 为唯一业务配置源。推荐：SPRING_PROFILES_ACTIVE=prod,nacos
spring.cloud.nacos.config.enabled=true
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:34.150.80.173:8848}
spring.cloud.nacos.config.file-extension=properties
spring.cloud.nacos.config.group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.config.username=${NACOS_USERNAME:}
spring.cloud.nacos.config.password=${NACOS_PASSWORD:}
spring.cloud.nacos.config.timeout=${NACOS_CONFIG_TIMEOUT_MS:3000}
spring.cloud.nacos.config.max-retry=${NACOS_CONFIG_MAX_RETRY:3}
spring.cloud.nacos.config.config-retry-time=${NACOS_CONFIG_RETRY_TIME_MS:1000}
spring.cloud.nacos.config.config-long-poll-timeout=${NACOS_CONFIG_LONG_POLL_TIMEOUT_MS:30000}
spring.cloud.nacos.config.enable-remote-sync-config=true

spring.cloud.nacos.discovery.enabled=true
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:34.150.80.173:8848}
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.discovery.group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:}

management.endpoints.web.exposure.include=health,info,nacos,metrics,prometheus

spring.config.import=nacos:databaseR2DBC-config.properties,\
  nacos:redis-config.properties,\
  nacos:langchain4j-config.properties,\
  nacos:cache-config.properties,\
  nacos:rabbitmq-config.properties,\
  nacos:api-rate-limit-config.properties,\
  nacos:chat-elasticsearch-config.properties,\
  nacos:knowledge-base-config.properties,\
  nacos:jwt-config.properties
