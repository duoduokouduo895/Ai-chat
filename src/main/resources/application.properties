spring.application.name=ai-agent-service
server.port=8080
server.address=0.0.0.0
spring.profiles.active=local
# 启用Spring Cloud Bootstrap，连接Nacos配置中心
spring.cloud.bootstrap.enabled=true


# 应用功能配置
# 数据库功能开关 (可选)
app.database.enabled=true

# 监控端点配置
management.endpoints.web.exposure.include=health,info,nacos
management.endpoint.health.show-details=always

# Jackson 时间序列化配置
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# Elasticsearch 同步配置
# 同步功能开关r
elasticsearch.sync.enabled=true
# 同步频率 (cron表达式: 每10分钟执行一次)
elasticsearch.sync.cron=0 */10 * * * ?
#elasticsearch.sync.cron=*/30 * * * * ?
# 批处理大小
elasticsearch.sync.batch-size=100

# 定时任务配置
# 清理空对话任务 (每天凌晨2点执行)
scheduled.cleanup.empty-conversations.cron=0 0 2 * * ?
# 监控空对话数量任务 (每小时执行一次)
scheduled.monitor.empty-conversations.cron=0 0 * * * ?

# JWT 看门狗机制 (滑动会话) 配置
# token 刷新窗口 (毫秒)。例如, 43200000 表示在 token 过期前的最后12小时内进行刷新
jwt.refresh-window=43200000

# 自动健康检查配置
# 健康检查功能开关
health-check.enabled=true
# 健康检查日志级别 (INFO/DEBUG)
health-check.log-level=INFO
# 健康检查频率 (cron表达式: 每10分钟执行一次)
health-check.cron=0 */10 * * * ?

# Character Encoding Settings
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.servlet.multipart.encoding=UTF-8

# 文件上传配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2KB

# WebFlux multipart配置
spring.webflux.multipart.max-in-memory-size=1MB
spring.webflux.multipart.max-disk-usage-per-part=10MB
spring.webflux.multipart.max-parts=128

# Jackson 反序列化配置：当JSON中有多余的、无法识别的字段时（如此处前端传来的timestamp），不抛出异常而是直接忽略
spring.jackson.deserialization.fail-on-unknown-properties=false
logging.level.org.example.ai_agent.controller.AiController=DEBUG

