spring.application.name=ai-agent-service
server.port=8080
server.address=0.0.0.0
spring.profiles.active=prod,nacos
spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.discovery.enabled=false
spring.config.import=optional:file:./DEFAULT_GROUP/databaseR2DBC-config.properties,\
  optional:file:./DEFAULT_GROUP/redis-config.properties,\
  optional:file:./DEFAULT_GROUP/langchain4j-config.properties,\
  optional:file:./DEFAULT_GROUP/cache-config.properties,\
  optional:file:./DEFAULT_GROUP/rabbitmq-config.properties,\
  optional:file:./DEFAULT_GROUP/api-rate-limit-config.properties,\
  optional:file:./DEFAULT_GROUP/chat-elasticsearch-config.properties,\
  optional:file:./DEFAULT_GROUP/knowledge-base-config.properties,\
  optional:file:./DEFAULT_GROUP/jwt-config.properties

# ===== 应用功能配置 =====
# 数据库功能开关 (可选)
app.database.enabled=true

# ===== Flyway 数据库版本管理 =====
# 禁用 Spring Boot 自动配置的 Flyway DataSource（由 FlywayConfig.java 手动构建）
spring.flyway.enabled=false

# ===== 监控端点配置 =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
performance.api.slow-threshold-ms=1000

# ===== Jackson 序列化配置 =====
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.jackson.deserialization.fail-on-unknown-properties=false

# ===== Elasticsearch 同步配置 =====
elasticsearch.sync.enabled=true
# 同步频率：低频离峰兜底重建，正常链路依赖写入时增量更新索引
elasticsearch.sync.cron=0 0 3 * * ?
elasticsearch.sync.batch-size=100
search.index-sync.queue-capacity=500
search.index-sync.retry-interval-ms=1000

# ===== 定时任务配置 =====
scheduled.cleanup.expired-guests.cron=0 0/5 * * * ?
scheduled.cleanup.expired-guests.ttl-hours=3
scheduled.cleanup.expired-guests.batch-size=100
# 清理空对话任务 (每天凌晨2点执行)
scheduled.cleanup.empty-conversations.cron=0 0 2 * * ?
scheduled.cleanup.empty-conversations.batch-size=100
# 监控空对话数量任务 (每小时执行一次)
scheduled.monitor.empty-conversations.cron=0 0 * * * ?
scheduled.calibration.knowledge-base-document-count.batch-size=100

# ===== JWT 看门狗机制 (滑动会话) =====
jwt.refresh-window=1800000

# ===== 健康检查配置 =====
health-check.enabled=false
health-check.log-level=DEBUG
health-check.cron=0 */10 * * * ?

# ===== 编码配置 =====
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.servlet.multipart.encoding=UTF-8

# ===== Repository 扫描关闭 =====
spring.data.redis.repositories.enabled=false
spring.data.elasticsearch.repositories.enabled=false

# ===== 文件上传配置 =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2KB

# ===== WebFlux multipart配置 =====
spring.webflux.multipart.max-in-memory-size=1MB
spring.webflux.multipart.max-disk-usage-per-part=10MB
spring.webflux.multipart.max-parts=128

# ===== CORS配置 =====
app.security.cors.allowed-origins=https://app.dduo.chat,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173


# ===== 启动报告配置 =====
startup.infrastructure-report.enabled=true
startup.infrastructure-report.timeout-seconds=5

# ===== 日志级别配置 =====
logging.level.org.example.ai_agent.controller.AiController=INFO
logging.level.com.alibaba.nacos=WARN
logging.level.com.alibaba.cloud.nacos=WARN
logging.level.org.springframework.cloud=WARN
logging.level.org.springframework.amqp.rabbit.connection=WARN
logging.level.org.springframework.amqp.rabbit.listener=WARN
logging.level.org.example.ai_agent.config.messaging.RabbitMQConfig=WARN
logging.level.org.example.ai_agent.task.HealthCheckTask=WARN
logging.level.org.example.ai_agent.util.JwtUtil=WARN
logging.level.org.example.ai_agent.filter.TokenRefreshFilter=WARN

# ===== RabbitMQ 文档消费背压 =====
# listener 仅在业务链完成后手动 ack，避免异步 subscribe 提前释放消息。
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
