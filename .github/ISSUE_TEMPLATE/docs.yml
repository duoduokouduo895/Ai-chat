name: "📝 文档问题"
description: 错字、过时信息、缺失说明
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: path
    attributes:
      label: 文档路径或 URL
      placeholder: 例如 README.md 或 docs/modules/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题是什么
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议改成什么
    validations:
      required: false
