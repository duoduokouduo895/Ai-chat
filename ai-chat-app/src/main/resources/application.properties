spring.application.name=ai-agent-service
server.port=8080
server.address=0.0.0.0
spring.profiles.active=prod,nacos

# ===== 应用功能配置 =====
# 数据库功能开关 (可选)
app.database.enabled=true
spring.r2dbc.pool.initial-size=2
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-acquire-time=3s
spring.r2dbc.pool.max-create-connection-time=3s

# ===== Flyway 数据库版本管理 =====
# 禁用 Spring Boot 自动配置的 Flyway DataSource（由 FlywayConfig.java 手动构建）
spring.flyway.enabled=false

# ===== 监控端点配置 =====
management.server.port=${MANAGEMENT_SERVER_PORT:9091}
management.server.address=${MANAGEMENT_SERVER_ADDRESS:0.0.0.0}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
performance.api.slow-threshold-ms=1000

# ===== AIDiag ADMIN BFF（默认关闭，失败不得阻断聊天主链） =====
aidiag.integration.enabled=${AIDIAG_INTEGRATION_ENABLED:false}
aidiag.integration.base-url=${AIDIAG_BASE_URL:http://aidiag-backend:8080}
aidiag.integration.username=${AIDIAG_READ_API_USERNAME:aidiag-reader}
aidiag.integration.secret-file=${AIDIAG_READ_API_SECRET_FILE:/run/secrets/aidiag.read-api.secret}
aidiag.integration.service-name=${AIDIAG_SERVICE_NAME:ai-chat-candidate}
aidiag.integration.timeout=${AIDIAG_TIMEOUT:3s}

# ===== Jackson 序列化配置 =====
spring.jackson2.serialization.write-dates-as-timestamps=false
spring.jackson2.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson2.time-zone=GMT+8
spring.jackson2.deserialization.fail-on-unknown-properties=false

# ===== Elasticsearch 同步配置 =====
elasticsearch.sync.enabled=true
# 同步频率：低频离峰兜底重建，正常链路依赖写入时增量更新索引
elasticsearch.sync.cron=0 0 3 * * ?
elasticsearch.sync.batch-size=100
search.index-sync.queue-capacity=500
search.index-sync.retry-interval-ms=1000

# ===== Hybrid RAG 检索配置 =====
knowledge-base.rag.retrieval-mode=hybrid
knowledge-base.search.index-name=${KNOWLEDGE_SEARCH_INDEX_NAME:knowledge_base_chunks}
knowledge-base.rag.vector-top-k=20
knowledge-base.rag.bm25-top-k=20
knowledge-base.rag.vector-timeout-ms=2500
knowledge-base.rag.bm25-timeout-ms=1500
knowledge-base.rag.rrf-k=60
knowledge-base.rag.enable-reranking=false
knowledge-base.rag.rerank.base-url=
knowledge-base.rag.rerank.api-key=
knowledge-base.rag.rerank.model=
knowledge-base.rag.rerank.timeout-ms=3000
knowledge-base.rag.rerank.top-n=20
knowledge-base.list.slow-threshold-ms=500

# ===== AI Provider Reliability =====
langchain4j.open-ai.reliability.retry-enabled=true
langchain4j.open-ai.reliability.retry-max-attempts=2
langchain4j.open-ai.reliability.retry-backoff-ms=500
langchain4j.open-ai.reliability.warmup-enabled=true

# ===== 定时任务配置 =====
assistant.chat-turn.max-duration-ms=${CHAT_TURN_MAX_DURATION_MS:300000}
assistant.chat-turn.recovery.enabled=${CHAT_TURN_RECOVERY_ENABLED:true}
assistant.chat-turn.recovery.stale-after=${CHAT_TURN_RECOVERY_STALE_AFTER:15m}
assistant.chat-turn.recovery.batch-size=${CHAT_TURN_RECOVERY_BATCH_SIZE:200}
assistant.chat-turn.recovery.interval-ms=${CHAT_TURN_RECOVERY_INTERVAL_MS:60000}
assistant.chat-turn.recovery.initial-delay-ms=${CHAT_TURN_RECOVERY_INITIAL_DELAY_MS:60000}

# ===== 长会话记忆（滚动摘要 / 关键约束 / 原文回读） =====
# 关闭后退回“只保留最近完整轮次”的旧行为；派生数据可随时从 message/chat_turn 重建。
assistant.memory.enabled=${ASSISTANT_MEMORY_ENABLED:true}
assistant.memory.trigger-ratio=${ASSISTANT_MEMORY_TRIGGER_RATIO:0.6}
assistant.memory.memory-max-ratio=${ASSISTANT_MEMORY_MAX_RATIO:0.3}
assistant.memory.keep-recent-ratio=${ASSISTANT_MEMORY_KEEP_RECENT_RATIO:0.35}
assistant.memory.summary-max-tokens=${ASSISTANT_MEMORY_SUMMARY_MAX_TOKENS:800}
assistant.memory.max-constraints=${ASSISTANT_MEMORY_MAX_CONSTRAINTS:20}
# 归档原文冗余副本的软上限，超出后按最早归档顺序淘汰
assistant.memory.archive-max-size=${ASSISTANT_MEMORY_ARCHIVE_MAX_SIZE:10GB}
assistant.memory.poll-delay-ms=${ASSISTANT_MEMORY_POLL_DELAY_MS:3000}
assistant.memory.model-timeout=${ASSISTANT_MEMORY_MODEL_TIMEOUT:90s}
scheduled.cleanup.expired-guests.cron=0 0/5 * * * ?
scheduled.cleanup.expired-guests.ttl-hours=3
scheduled.cleanup.expired-guests.batch-size=100
# 清理空对话任务 (每天凌晨2点执行)
scheduled.cleanup.empty-conversations.cron=0 0 2 * * ?
scheduled.cleanup.empty-conversations.batch-size=100
# 监控空对话数量任务 (每小时执行一次)
scheduled.monitor.empty-conversations.cron=0 0 * * * ?
scheduled.calibration.knowledge-base-document-count.batch-size=100

# ===== JWT 看门狗机制 (滑动会话) =====
jwt.refresh-window=1800000

# ===== 健康检查配置 =====
health-check.enabled=false
health-check.log-level=DEBUG
health-check.cron=0 */10 * * * ?

# ===== 编码配置 =====
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.servlet.multipart.encoding=UTF-8

# ===== Repository 扫描关闭 =====
spring.data.redis.repositories.enabled=false
spring.data.elasticsearch.repositories.enabled=false
spring.http.codecs.preferred-json-mapper=jackson2

# ===== 文件上传配置 =====
knowledge-base.upload.max-file-size=10MB
knowledge-base.upload.max-request-size=15MB
knowledge-base.upload.max-form-field-size=8KB
knowledge-base.upload.max-uncompressed-size=50MB
knowledge-base.upload.max-batch-files=5
knowledge-base.upload.max-archive-entries=1000

# ===== 文档解析资源隔离 =====
# 解析运行在专用、有界线程池；所有值还会在代码中受到硬上限约束。
knowledge-base.processing.parse-timeout=90s
knowledge-base.processing.ai-enhancement-timeout=90s
knowledge-base.processing.consumer-timeout=5m
knowledge-base.processing.parser-max-threads=2
knowledge-base.processing.parser-queue-capacity=20
knowledge-base.processing.max-extracted-characters=1000000
knowledge-base.processing.max-ai-enhancement-characters=50000
knowledge-base.processing.publish-confirm-timeout=5s
knowledge-base.processing.outbox-batch-size=20
knowledge-base.processing.outbox-claim-timeout=2m
knowledge-base.processing.outbox-retry-delay=5s
knowledge-base.processing.outbox-max-retry-delay=5m
knowledge-base.processing.outbox-dispatch-delay-ms=5000
knowledge-base.processing.ingestion-lease-duration=5m
knowledge-base.processing.versioned-ingestion-enabled=false
knowledge-base.cleanup.enabled=${KNOWLEDGE_CLEANUP_ENABLED:true}
knowledge-base.cleanup.poll-delay-ms=${KNOWLEDGE_CLEANUP_POLL_DELAY_MS:5000}
knowledge-base.cleanup.quiescence-seconds=${KNOWLEDGE_CLEANUP_QUIESCENCE_SECONDS:720}
knowledge-base.cleanup.max-attempts=${KNOWLEDGE_CLEANUP_MAX_ATTEMPTS:8}

# ===== WebFlux multipart配置 =====
spring.webflux.multipart.max-in-memory-size=256KB
spring.webflux.multipart.max-disk-usage-per-part=${knowledge-base.upload.max-file-size}
spring.webflux.multipart.max-parts=16

# ===== CORS配置 =====
app.security.cors.allowed-origins=https://dduo.chat,https://app.dduo.chat,https://app.dduo.me,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173


# ===== 启动报告配置 =====
startup.infrastructure-report.enabled=true
startup.infrastructure-report.timeout-seconds=5
startup.infrastructure-report.mysql-warmup-connections=${spring.r2dbc.pool.initial-size:2}

# ===== 日志级别配置 =====
logging.level.org.example.ai_agent.controller.AiController=INFO
logging.level.com.alibaba.nacos=WARN
logging.level.com.alibaba.cloud.nacos=WARN
logging.level.org.springframework.cloud=WARN
logging.level.org.springframework.amqp.rabbit.connection=WARN
logging.level.org.springframework.amqp.rabbit.listener=WARN
logging.level.org.example.ai_agent.config.messaging.RabbitMQConfig=WARN
logging.level.org.example.ai_agent.task.HealthCheckTask=WARN
logging.level.org.example.ai_agent.util.JwtUtil=WARN
logging.level.org.example.ai_agent.filter.TokenRefreshFilter=WARN
logging.config=classpath:logback-spring.xml

# ===== RabbitMQ 文档消费背压 =====
# listener 仅在业务链完成后手动 ack，避免异步 subscribe 提前释放消息。
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# 发布端必须等待 broker confirm，并接收不可路由消息；否则 ingestion 不会被误报为已受理。
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
